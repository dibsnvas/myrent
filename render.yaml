# Render Blueprint: Render dashboard -> New -> Blueprint -> pick this repository -> Deploy.
# Creates the API and a free Postgres database and wires them together; nothing to copy by hand.
# Free Postgres on Render expires 30 days after creation (then 14 days to upgrade or move the data).
databases:
  - name: myrent-db
    plan: free
    region: frankfurt
    databaseName: myrent
    user: myrent

services:
  - type: web
    name: myrent-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn settings.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: MYRENT_ENV_ID
        value: prod
      - key: MYRENT_SECRET_KEY
        generateValue: true
      - key: MYRENT_CRON_SECRET
        generateValue: true
      - key: MYRENT_ALLOWED_HOSTS
        value: "" # Render's own hostname is added automatically
      - key: MYRENT_CORS_ALLOWED_ORIGINS
        value: ""
      - key: MYRENT_CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://myrent-kbtu[a-z0-9-]*\.vercel\.app$
      - key: MYRENT_FRONTEND_URL
        value: https://myrent-kbtu.vercel.app
      - key: MYRENT_FILE_STORAGE
        value: database
      - key: MYRENT_SEED_DEMO
        value: "True"
      - key: MYRENT_DB_HOST
        fromDatabase: { name: myrent-db, property: host }
      - key: MYRENT_DB_PORT
        fromDatabase: { name: myrent-db, property: port }
      - key: MYRENT_DB_NAME
        fromDatabase: { name: myrent-db, property: database }
      - key: MYRENT_DB_USER
        fromDatabase: { name: myrent-db, property: user }
      - key: MYRENT_DB_PASSWORD
        fromDatabase: { name: myrent-db, property: password }
      - key: MYRENT_DB_SSLMODE
        value: prefer # internal network connection
